[versions]
agp = "9.3.1"
kotlin = "2.3.21"

# compose-ui 1.12.x and core-ktx 1.19.0 require compiling against API 37.
# AGP 9.3 supports API 37 as its maximum.
compileSdk = "37"
# targetSdk stays at 36: that is what Google Play requires, and opting in to
# API 37 runtime behaviour is a separate decision from compiling against it.
targetSdk = "36"
minSdk = "23"

# Compose
#
# No compose-bom here on purpose. The BOM (2026.06.01) pins material3 to 1.4.0 and
# compose-ui to 1.11.4, but the Expressive component set (ButtonGroup, FloatingToolbar,
# LoadingIndicator, MaterialShapes, SplitButton, FloatingActionButtonMenu) only exists
# from material3 1.5.0-alpha onwards -- verified against the class list of
# material3-android-1.4.0.aar. material3 1.5.0-alpha25 in turn requires compose-ui
# 1.12.0-beta01, which the BOM's platform constraint would force back down to 1.11.4.
# So Compose is pinned explicitly to a coherent 1.12 set instead.
compose = "1.12.0-rc01"
material3 = "1.5.0-alpha25"

activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
coreKtx = "1.19.0"
palette = "1.0.0"
localbroadcastmanager = "1.1.0"
profileinstaller = "1.4.1"

# Media
media3 = "1.10.1"

# Misc
gson = "2.14.0"
okhttp = "5.4.0"
coil = "3.5.0"


[libraries]
# Compose
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material3-windowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

# Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# Misc
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
